name: Build & Deploy

on: [workflow_dispatch]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: windows-2025

    strategy:
      matrix:
        revitYear: [2025, 2026, 2027]

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '5.12.x'

    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v0.10.2
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Compute package version
      shell: pwsh
      run: |
        $base = "${{ matrix.revitYear }}.$env:GITVERSION_MINOR.$env:GITVERSION_PATCH"
        $pkgVersion = "$base$env:GITVERSION_PRERELEASETAGWITHDASH"

        $revitConst = "REVIT${{ matrix.revitYear }}"

        "PKG_VERSION=$pkgVersion" >> $env:GITHUB_ENV
        "REVIT_CONST=$revitConst" >> $env:GITHUB_ENV

        Write-Host "Computed PKG_VERSION: $pkgVersion"
        Write-Host "DefineConstants: $revitConst"
        Write-Host "SemVer (GitVersion): $env:GITVERSION_SEMVER"

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      shell: pwsh
      run: |
        dotnet restore ./Source/Scotec.Revit.slnx `
          -p:RevitYear="${{ matrix.revitYear }}" `
          -p:DefineConstants="$env:REVIT_CONST"

    # Important:
    # Do not generate NuGet packages yet. The assemblies must be signed first.
    - name: Build
      shell: pwsh
      run: |
        dotnet build --no-restore ./Source/Scotec.Revit.slnx -c Release `
          -p:CompanyName="scotec Software Solutions AB" `
          -p:RevitYear="${{ matrix.revitYear }}" `
          -p:DefineConstants="$env:REVIT_CONST" `
          -p:Version="$env:PKG_VERSION" `
          -p:PackageVersion="$env:PKG_VERSION" `
          -p:InformationalVersion="$env:PKG_VERSION+$env:GITVERSION_SHA" `
          -p:GeneratePackageOnBuild=false

    - name: Azure login
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # Build a precise list of our assemblies.
    # This avoids signing third-party assemblies and obj/ref assemblies.
    - name: Create signing file list
      shell: pwsh
      run: |
        $sourceRoot = Join-Path $env:GITHUB_WORKSPACE "Source"

        $files = Get-ChildItem `
          -Path $sourceRoot `
          -Recurse `
          -File `
          -Filter "Scotec*.dll" |
          Where-Object {
            $_.FullName -match '\\bin\\Release\\'
          }

        if (-not $files) {
          throw "No Scotec DLLs were found for signing."
        }

        $catalog = Join-Path $env:GITHUB_WORKSPACE "signing-files.txt"

        $files |
          ForEach-Object {
            [System.IO.Path]::GetRelativePath(
              $env:GITHUB_WORKSPACE,
              $_.FullName
            )
          } |
          Set-Content $catalog

        Write-Host "Files to sign:"
        Get-Content $catalog

    - name: Sign assemblies
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        files-catalog: ${{ github.workspace }}\signing-files.txt
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Verify signatures
      shell: pwsh
      run: |
        $catalog = Join-Path $env:GITHUB_WORKSPACE "signing-files.txt"

        foreach ($relativePath in Get-Content $catalog) {
          $file = Join-Path $env:GITHUB_WORKSPACE $relativePath
          $signature = Get-AuthenticodeSignature $file

          Write-Host "$relativePath : $($signature.Status)"

          if ($signature.Status -ne "Valid") {
            throw "Invalid signature: $relativePath ($($signature.Status))"
          }
        }

    # Now package the already signed assemblies.
    - name: Pack
      shell: pwsh
      run: |
        dotnet pack --no-build ./Source/Scotec.Revit.slnx -c Release `
          -p:CompanyName="scotec Software Solutions AB" `
          -p:RevitYear="${{ matrix.revitYear }}" `
          -p:DefineConstants="$env:REVIT_CONST" `
          -p:Version="$env:PKG_VERSION" `
          -p:PackageVersion="$env:PKG_VERSION" `
          -p:InformationalVersion="$env:PKG_VERSION+$env:GITVERSION_SHA" `
          -p:PackageOutputPath="$env:GITHUB_WORKSPACE\localPackages"

    - name: Push package
      shell: pwsh
      run: |
        dotnet nuget push "$env:GITHUB_WORKSPACE\localPackages\*.nupkg" `
          -s https://api.nuget.org/v3/index.json `
          -k "${{ secrets.NUGET_API_KEY }}" `
          --skip-duplicate